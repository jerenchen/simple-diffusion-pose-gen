[workspace]
authors = ["Jeren C."]
channels = ["conda-forge"]
name = "simple-diffusion-pose-gen"
platforms = ["osx-arm64"]
version = "0.1.0"

[tasks]
download-landmarker = "curl -o ./python/tasks/pose_landmarker_full.task 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/latest/pose_landmarker_full.task'" 
diffusion-posegen = "python python/simple-diffusion-pose-gen.py"
posegen-server = "python python/posegen.py"

[dependencies]
python = ">=3.11,<3.12"
pip = ">=26.0.1,<27"

[pypi-dependencies]
torch = ">=2.10.0, <3"
diffusers = ">=0.37.1, <0.38"
mediapipe = "==0.10.21"
transformers = ">=5.6.2, <6"
accelerate = ">=1.13.0, <2"
peft = ">=0.19.1, <0.20"
pyside6 = ">=6.11.0, <7"
torchvision = ">=0.25.0, <0.26"
